services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sajilopos}
      POSTGRES_USER: ${POSTGRES_USER:-sajilopos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sajilopos-secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
